# CS 4273 – Capstone | Fall 2026 | GROUP F
# @brief: This file automates tests for every push to main and every pull request targeting main.

name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: src/apps/web
      # Runs parser (pytest) and web (vitest + build) sections; fails below coverage thresholds.
      - run: python src/scripts/capstone.py test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/python
            src/apps/web/coverage
          if-no-files-found: ignore

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - run: npm ci
        working-directory: src/apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: src/apps/web
      - run: python src/scripts/capstone.py test --section e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/apps/web/playwright-report
          if-no-files-found: ignore
