[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ame-parser"
version = "0.1.0"
description = "Deterministic FAA AME Guide and OneGuide PDF extraction"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
dev = [
  "pypdf>=5,<7",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
ame-parser = "ame_parser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: parses targeted pages from supplied FAA PDFs",
  "characterization: records behavior of the unchanged legacy parser",
]

[tool.coverage.run]
source = ["ame_parser"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
